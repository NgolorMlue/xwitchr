services:
  xwitchr:
    image: xwitchr:alpine
    build:
      context: .
      args:
        APP_PORT: ${PORT:-51067}
        DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
        DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD must be set in your .env or environment}
    ports:
      - "${PORT:-51067}:${PORT:-51067}"
    environment:
      PORT: ${PORT:-51067}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD must be set in your .env or environment}
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    restart: unless-stopped
